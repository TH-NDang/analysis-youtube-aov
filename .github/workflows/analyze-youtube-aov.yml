name: Validate AOV analysis code

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/analyze-youtube-aov.yml"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile scripts/*.py

      - name: Validate JSON configs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("config").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

      - name: Smoke test CLIs
        run: |
          python scripts/analyze_dataset.py --help >/dev/null
          python scripts/sync_garena_entities.py --help >/dev/null
